plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.retracksplayer'
version = '0.1.0'

// アプリ側（Expo の prebuild が生成する build.gradle）が定義していればそれに追従し、
// 無ければ既知の安定版に固定する。
def media3Version = rootProject.ext.has('androidxMedia3Version')
  ? rootProject.ext.get('androidxMedia3Version')
  : '1.11.0'

android {
  namespace "expo.modules.retracksplayer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"
}
